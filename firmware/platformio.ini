; ESP32 firmware for the 16x16 blinkenlights panel.
;
; First flash, over USB (once):
;   cp src/secrets.example.h src/secrets.h      then fill in Wi-Fi
;   pio run -e usb -t upload
; Every flash after that, over Wi-Fi:
;   pio run -e ota -t upload
[platformio]
default_envs = usb

[env]
; Pinned: newer FastLED (3.10+) needs a newer compiler than the Arduino-ESP32 2.x toolchain has.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps = fastled/FastLED@3.7.8
build_flags = -O2

[env:usb]
upload_speed = 921600

[env:ota]
upload_protocol = espota
upload_port = blinkpanel.local
; must match OTA_PASSWORD in src/secrets.h
upload_flags = --auth=blinken

; Seeed XIAO ESP32-S3 (one USB-C port, tiny B and R buttons). Panel DIN goes to the pin marked D0.
;   pio run -e s3 -t upload        then   pio run -e s3-ota -t upload
; Upload stuck? Hold B, tap R, let go of B, then upload again.
[env:s3]
board = seeed_xiao_esp32s3
upload_speed = 115200
build_flags = -O2 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_DATA_PIN=1

[env:s3-ota]
board = seeed_xiao_esp32s3
build_flags = -O2 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_DATA_PIN=1
upload_protocol = espota
; the panel's reserved address or blinkpanel.local where mDNS resolves
upload_port = blinkpanel.local
upload_flags = --auth=blinken
